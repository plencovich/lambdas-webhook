AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Botmaker webhook ingestion API for RDS persistence.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARNING
      - ERROR
      - CRITICAL
  DbHost:
    Type: String
    Default: ""
    NoEcho: true
    Description: RDS MySQL host.
  DbPort:
    Type: Number
    Default: 3306
    Description: RDS MySQL port.
  DbName:
    Type: String
    Default: ""
    NoEcho: true
    Description: RDS database name.
  DbUser:
    Type: String
    Default: ""
    NoEcho: true
    Description: RDS database user.
  DbPassword:
    Type: String
    Default: ""
    NoEcho: true
    Description: RDS database password.

Globals:
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        APP_ENV: !Ref Environment
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: !Ref LogLevel
        PROVIDER_NAME: botmaker
        DB_HOST: !Ref DbHost
        DB_PORT: !Ref DbPort
        DB_NAME: !Ref DbName
        DB_USER: !Ref DbUser
        DB_PASSWORD: !Ref DbPassword
        DB_CONNECT_TIMEOUT_SECONDS: "5"

Resources:
  WebhookApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      EndpointConfiguration: REGIONAL
      TracingEnabled: true

  CommonDependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-common-dependencies"
      Description: Shared Python dependencies for webhook Lambdas.
      ContentUri: layer/
      CompatibleRuntimes:
        - python3.13
      CompatibleArchitectures:
        - x86_64
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: python3.13
      BuildArchitecture: x86_64

  IncomingWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-incoming"
      CodeUri: src/
      Handler: handlers.incoming_handler.lambda_handler
      Layers:
        - !Ref CommonDependenciesLayer
      Events:
        IncomingWebhookApi:
          Type: Api
          Properties:
            RestApiId: !Ref WebhookApi
            Path: /incoming
            Method: POST

  OutgoingWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-outgoing"
      CodeUri: src/
      Handler: handlers.outgoing_handler.lambda_handler
      Layers:
        - !Ref CommonDependenciesLayer
      Events:
        OutgoingWebhookApi:
          Type: Api
          Properties:
            RestApiId: !Ref WebhookApi
            Path: /outgoing
            Method: POST

  StatusWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-status"
      CodeUri: src/
      Handler: handlers.status_handler.lambda_handler
      Layers:
        - !Ref CommonDependenciesLayer
      Events:
        StatusWebhookApi:
          Type: Api
          Properties:
            RestApiId: !Ref WebhookApi
            Path: /status
            Method: POST

Outputs:
  WebhookApiUrl:
    Description: API Gateway stage URL.
    Value: !Sub "https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
  IncomingWebhookPath:
    Description: Incoming webhook endpoint.
    Value: !Sub "https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/incoming"
  OutgoingWebhookPath:
    Description: Outgoing webhook endpoint.
    Value: !Sub "https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/outgoing"
  StatusWebhookPath:
    Description: Status webhook endpoint.
    Value: !Sub "https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/status"
